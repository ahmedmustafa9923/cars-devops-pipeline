apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cars-data-pvc
spec:
  accessModes:
    - ReadWriteMany # Allows all 3 pods to read and write to the same folders at the same time
  resources:
    requests:
      storage: 10Gi  # Provisions a 10 Gigabyte cloud storage disk for your automotive files
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-app-production
  labels:
    app: cars-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate # Ensures zero-downtime when you push code updates
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cars-app
  template:
    metadata:
      labels:
        app: cars-app
    spec:
      containers:
      - name: cars-container
        image: YOUR_DOCKERHUB_USERNAME/cars-app:latest # Your production image hosted online
        ports:
        - containerPort: 8080
        # Mount the external cloud storage drive directly into your application directory
        volumeMounts:
        - name: storage-volume
          mountPath: /app/1_inventory
          subPath: inventory
        - name: storage-volume
          mountPath: /app/2_dealerships
          subPath: dealerships
        - name: storage-volume
          mountPath: /app/3_crm_and_history
          subPath: crm
        - name: storage-volume
          mountPath: /app/4_finance
          subPath: finance
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: cars-data-pvc # Binds the storage to the disk created above
---
apiVersion: v1
kind: Service
metadata:
  name: cars-app-production-service
spec:
  type: LoadBalancer
  ports:
  - port: 80         # Standard web port for production traffic
    targetPort: 8080
  selector:
    app: cars-app


